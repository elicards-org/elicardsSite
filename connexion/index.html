<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Elicards</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070E36">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#F4F6FB;--ink:#0B1650;--muted:#4F5A86;--accent:#1F3BB3;--primary:#D7263D;--primary-press:#A9142A}
  @media (prefers-color-scheme: dark){:root{--bg:#070E36;--ink:#F4F6FB;--muted:#A9B3DE;--accent:#6E8BFF}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
    font:16px/24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
  main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
  h1{margin:0;font-size:28px;line-height:32px}
  p{margin:0;color:var(--muted)}
  a.btn{display:block;width:100%;padding:16px 24px;border-radius:16px;background:var(--primary);color:#fff;font-weight:700;
    text-decoration:none;box-shadow:0 5px 0 var(--primary-press)}
  a.lien{color:var(--accent);font-weight:700;text-decoration:none;padding:8px}
</style>
</head>
<body>
<main>
  <h1>Connexion à Elicards</h1>
  <p id="texte">Ouverture de l’app…</p>
  <a class="btn" id="ouvrir" href="#" hidden>Ouvrir Elicards</a>
  <a class="lien" id="web" href="#" hidden>Continuer sur app.elicards.fr</a>
</main>
<script>
  // Lien de connexion reçu par email (Firebase, sendSignInLinkToEmail). Firebase envoie tous les liens ici
  // (adresse d’action de la console), avec l’adresse de retour demandée par l’app dans continueUrl :
  //  · lien demandé sur le site (continueUrl = https://app.elicards.fr/…) : on y renvoie aussitôt, avec les
  //    paramètres du lien (l’app web le termine elle-même, www/js/ecrans/accueil-compte.js) ;
  //  · lien demandé dans l’app iPhone ou Android (continueUrl = cette page) : on rouvre l’app par le schéma
  //    elicards://connexion?lien=… (traiterLienConnexion), et si l’app n’est pas là, on propose le site.
  (function () {
    var lien = location.href;
    var p = new URLSearchParams(location.search);
    var estLien = !!p.get("oobCode") && p.get("mode") === "signIn";
    var texte = document.getElementById("texte"), bouton = document.getElementById("ouvrir"), web = document.getElementById("web");
    if (!estLien) { texte.textContent = "Ce lien n’est pas un lien de connexion. Demande-en un nouveau depuis l’app."; return; }

    // Le site reçoit les paramètres du lien tels que Firebase les lui aurait donnés (apiKey, oobCode, mode, lang)
    function versSite(base) {
      var u = new URL(base);
      ["apiKey", "oobCode", "mode", "lang"].forEach(function (k) { if (p.get(k)) u.searchParams.set(k, p.get(k)); });
      return u.toString();
    }
    var suite = p.get("continueUrl") || "";
    var origine = "";
    try { origine = suite ? new URL(suite) : ""; } catch (e) { origine = ""; }
    // Seulement nos propres adresses (pas de renvoi vers un site quelconque) et pas cette page elle-même
    var site = origine && origine.protocol === "https:" && /(^|\.)elicards\.fr$/.test(origine.hostname)
      && !(origine.hostname === "elicards.fr" && /^\/connexion\/?$/.test(origine.pathname));
    if (site) { texte.textContent = "Connexion en cours…"; location.replace(versSite(suite)); return; }

    var app = "elicards://connexion?lien=" + encodeURIComponent(lien);
    bouton.href = app;
    bouton.hidden = false;
    web.href = versSite("https://app.elicards.fr/");
    texte.textContent = "Si l’app ne s’ouvre pas toute seule, touche le bouton ci-dessous, sur le téléphone où tu as demandé le lien.";
    location.href = app;
    // L’app ne s’est pas ouverte (pas installée sur ce téléphone, ou supprimée) : la page est toujours là
    setTimeout(function () {
      if (document.hidden) return;
      web.hidden = false;
      texte.textContent = "L’app Elicards ne s’est pas ouverte. Si elle n’est pas installée sur ce téléphone, continue sur le site : ta connexion y sera terminée.";
    }, 1500);
  })();
</script>
</body>
</html>
